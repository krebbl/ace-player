services:
  acestream:
    image: blaiseio/acelink:latest
    # Engine is published amd64-only; emulated on arm64 hosts via Rosetta/qemu.
    platform: linux/amd64
    container_name: ace-engine
    restart: unless-stopped
    expose:
      - "6878"
    networks: [internal]

  app:
    build: ./app
    container_name: ace-app
    restart: unless-stopped
    depends_on: [acestream]
    expose:
      - "8080"
    environment:
      - ACE_ENGINE_URL=http://acestream:6878
      - HLS_IDLE_TIMEOUT=120
      - DB_PATH=/data/catalog.db
      - HLS_DIR=/tmp/hls
      - VIRTUAL_HOST=$DOMAIN
    volumes:
      - catalog:/data
      - hls-tmp:/tmp/hls
    networks: [internal, nginx]

volumes:
  catalog:
  hls-tmp:

networks:
  internal:
  nginx:
    external: true
    name: nginx-proxy

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>Ace Player</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="import-modal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>Select Channel Categories</h2>
    <p class="modal-desc">Choose the categories of channels you want to import. This may take a moment.</p>
    <div id="category-grid" class="category-grid"></div>
    <div class="modal-actions">
      <button id="import-btn" type="button" disabled>Import Selected</button>
    </div>
    <div id="import-progress" class="import-progress" hidden>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="progress-text" class="progress-text"></p>
    </div>
  </div>
</div>

<header id="header">
  <div class="row">
    <input id="q" type="search" placeholder="Search channels…" autocomplete="off" inputmode="search">
    <button id="close-overlay" type="button" aria-label="Close search" hidden>✕</button>
  </div>
</header>

<main id="player">
  <video id="video" autoplay playsinline></video>
  <button id="play-btn" aria-label="Play" hidden>▶</button>

  <section id="results" aria-label="Channels">
    <div id="search-status" class="search-status"></div>
    <div id="grid"></div>
  </section>
</main>

<footer id="footer">
  <div class="footer-left">
    <div id="footer-channel" class="footer-channel">No channel selected</div>
    <div id="footer-meta" class="footer-meta"></div>
  </div>
  <div class="footer-right">
    <span id="footer-status" class="status-dot"></span>
    <button id="airplay-btn" type="button" aria-label="AirPlay" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/>
        <polygon points="12 15 17 21 7 21 12 15" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
</footer>

<script src="/vendor/hls.min.js"></script>
<script src="/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>Ace Player</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="header">
  <div class="row">
    <input id="q" type="search" placeholder="Search channels…" autocomplete="off" inputmode="search">
    <button id="close-overlay" type="button" aria-label="Close search" hidden>✕</button>
  </div>
</header>

<main id="player">
  <video id="video" autoplay playsinline></video>
  <button id="play-btn" aria-label="Play" hidden>▶</button>

  <section id="results" aria-label="Channels">
    <div id="search-status" class="search-status"></div>
    <div id="grid"></div>
  </section>
</main>

<footer id="footer">
  <div class="footer-left">
    <div id="footer-channel" class="footer-channel">No channel selected</div>
    <div id="footer-meta" class="footer-meta"></div>
  </div>
  <div id="footer-status" class="footer-right"></div>
</footer>

<script src="/vendor/hls.min.js"></script>
<script src="/app.js" defer></script>
</body>
</html>
